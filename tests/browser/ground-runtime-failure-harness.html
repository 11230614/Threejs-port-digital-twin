<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Ground Runtime failure harness</title></head>
  <body>
    <div id="runtime-container" style="width: 800px; height: 600px; position: relative"></div>
    <script type="module">
      import * as THREE from "three";
      import { PortRuntime } from "/src/app/PortRuntime.ts";
      import { GroundSystem } from "/src/world/GroundSystem.ts";
      import { MainScene } from "/src/scene/MainScene.ts";
      import { createPinia, setActivePinia } from "pinia";

      window.runGroundRuntimeFailure = async () => {
        const originalGroundCreate = GroundSystem.prototype.create;
        const originalMainSceneDestroy = MainScene.prototype.destroy;
        const failureMessage = "injected GroundSystem dock attachment failure";
        const cleanupMessage = "injected secondary MainScene cleanup failure";
        const run = async (injectCleanupFailure) => {
          const container = document.querySelector("#runtime-container");
          container.innerHTML = "";
          const runtime = new PortRuntime({ container });
          setActivePinia(createPinia());
          const sentinel = new THREE.Object3D();
          sentinel.name = "runtime-failure-sentinel";
          const disposed = new Map();
          let capturedScene = null;
          let groundBaseline = new Set();
          let injected = false;

          GroundSystem.prototype.create = function (...args) {
            this.scene.add(sentinel);
            groundBaseline = new Set(this.scene.children);
            const originalAdd = this.scene.add;
            this.scene.add = function (...objects) {
              if (objects.some((object) => object?.name === "dock-ground")) {
                capturedScene = this;
                const partial = [...this.children].filter((object) => !groundBaseline.has(object));
                partial.forEach((root) => root.traverse((object) => {
                  const materials = Array.isArray(object.material) ? object.material : [object.material];
                  [object.geometry, ...materials].filter(Boolean).forEach((resource) => {
                    if (!resource.addEventListener) return;
                    const key = resource.uuid;
                    disposed.set(key, 0);
                    resource.addEventListener("dispose", () => disposed.set(key, (disposed.get(key) ?? 0) + 1));
                    Object.values(resource).filter((value) => value?.isTexture && value.addEventListener).forEach((texture) => {
                      const textureKey = texture.uuid;
                      disposed.set(textureKey, 0);
                      texture.addEventListener("dispose", () => disposed.set(textureKey, (disposed.get(textureKey) ?? 0) + 1));
                    });
                  });
                }));
                injected = true;
                throw new Error(failureMessage);
              }
              return originalAdd.apply(this, objects);
            };
            try {
              return originalGroundCreate.apply(this, args);
            } finally {
              this.scene.add = originalAdd;
            }
          };
          if (injectCleanupFailure) {
            MainScene.prototype.destroy = function (...args) {
              originalMainSceneDestroy.apply(this, args);
              throw new Error(cleanupMessage);
            };
          }

          let caughtMessage = "";
          try {
            await runtime.start();
          } catch (error) {
            caughtMessage = error instanceof Error ? error.message : String(error);
          } finally {
            GroundSystem.prototype.create = originalGroundCreate;
            MainScene.prototype.destroy = originalMainSceneDestroy;
          }
          const scene = capturedScene;
          const report = {
            caughtMessage,
            injected,
            runtimeDestroyed: runtime.destroyed,
            runtimeStarted: runtime.started,
            groundInstanceRetained: Boolean(runtime.groundSystem),
            groundRefsReset: Boolean(runtime.groundSystem && runtime.groundSystem.water === null && runtime.groundSystem.roadSystem === null),
            sentinelPreserved: Boolean(scene?.children.includes(sentinel)),
            noGroundObjects: Boolean(scene && scene.children.every((object) => groundBaseline.has(object))),
            canvasRemoved: !container.querySelector("canvas"),
            frameTasks: runtime.frameObserver?.tasks?.length ?? -1,
            frameListeners: runtime.frameObserver?.frameListeners?.length ?? -1,
            disposeCounts: [...disposed.values()],
            disposeEachOnce: [...disposed.values()].length > 0 && [...disposed.values()].every((count) => count === 1),
          };
          return report;
        };

        const fullCleanup = await run(false);
        const secondaryError = await run(true);
        return { fullCleanup, secondaryError, failureMessage, cleanupMessage };
      };
    </script>
  </body>
</html>
